# Teşhis: uygulamanın veri kaynakları yanıt veriyor mu? Elle çalışır (herkese açık depo → ücretsiz).
name: Kaynak kontrolü
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/kaynak_kontrol.py
