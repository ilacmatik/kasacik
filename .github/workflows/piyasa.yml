# Kasacık veri sunucusu: borsa fiyatlarını piyasa.json'a yazar (GitHub Pages yayınlar).
# Herkese açık depoda Actions ücretsizdir; APK derleme kotasını etkilemez.
#
# GitHub'ın sık zamanlanmış işleri saatlerce gecikebildiği için iş gün içinde birkaç kez tetiklenir
# ve her seferinde kendi içinde döner (scripts/piyasa_dongu.py):
#   BIST seansı (TR 10:00–18:15): 15 dakikada bir · ABD seansı: saatte bir · UTC 21:15'te durur.
# Aynı anda tek iş çalışır; bir tetikleme kaçarsa ya da gecikirse sonraki devam ettirir.
name: Piyasa verisi

on:
  schedule:
    # Saatler UTC (Türkiye = UTC+3)
    - cron: "50 6 * * 1-5"
    - cron: "5 9 * * 1-5"
    - cron: "5 12 * * 1-5"
    - cron: "5 15 * * 1-5"
    - cron: "5 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: piyasa
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fiyatları topla ve yayınla (seans boyunca)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/piyasa_dongu.py
      # Süre dolduğunda gün bitmediyse kendini yeniden başlatır (zamanlanmış tetikleme kaçsa bile zincir kopmaz)
      - name: Devam ettir
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .devam ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/piyasa.yml/dispatches" -f ref=main && echo "Yeni tur başlatıldı."
          fi
